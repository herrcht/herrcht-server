spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/herrcht_db
    username: herrcht_user
    password: herrcht_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: 8080

logging:
  level:
    org.herrcht: DEBUG
    org.liquibase: INFO
    org.hibernate.SQL: DEBUG

herrcht:
  security:
    email-recovery-mode: OPTIONAL # Opções: DISABLED, OPTIONAL, REQUIRED
    max-profiles-per-user: 5      # 0 = sem limites
    max-emails-per-user: 3        # 0 = sem limites
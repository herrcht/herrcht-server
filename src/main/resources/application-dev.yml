spring:
  config:
    activate:
      on-profile: dev
  data:
    redis:
      host: localhost
      port: 6379

  datasource:
    url: jdbc:postgresql://localhost:5432/herrcht_db
    username: herrcht_user
    password: herrcht_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: 8080

logging:
  level:
    org.herrcht: DEBUG
    org.liquibase: INFO
    org.hibernate.SQL: DEBUG

herrcht:
  security:
    email-recovery-mode: OPTIONAL
    max-profiles-per-user: 5
    max-emails-per-user: 3
  session:
    store-type: DATABASE     # Opções: NONE, IN_MEMORY, DATABASE, REDIS
    session-ttl-days: 30      # Min: 1 | Max: 180
    access-ttl-minutes: 15    # Min: 5 | Max: 240 (se store-type=NONE, reduz para max 30)